<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oráculo da Lua | Experiência Premium de Leitura</title>
  <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <main class="container py-5">
    <section class="hero glass mb-4 text-center">
      <p class="eyebrow mb-2">Experiência de leitura espiritual</p>
      <h1 class="mb-3">Oráculo da Lua</h1>
      <p class="lead mb-3">Uma aplicação elegante para leitura de <strong>Tarô</strong>, <strong>Baralho Cigano</strong> e <strong>Cartas Místicas</strong>.</p>
      <div class="chips" id="deck-badges" aria-label="Oráculos disponíveis"></div>
    </section>

    <section class="glass p-4 mb-4">
      <form id="reading-form" class="row g-3" novalidate>
        <div class="col-lg-4">
          <label for="deck" class="form-label">Oráculo</label>
          <select class="form-select" id="deck" required>
            <option value="tarot">Tarô</option>
            <option value="cigano">Baralho Cigano</option>
            <option value="cartas">Cartas Místicas</option>
          </select>
        </div>

        <div class="col-lg-4">
          <label for="spread" class="form-label">Tiragem</label>
          <select class="form-select" id="spread" required>
            <option value="1">Carta única · Conselho direto</option>
            <option value="3">3 cartas · Passado, Presente e Futuro</option>
          </select>
        </div>

        <div class="col-lg-4">
          <label for="theme" class="form-label">Tema da leitura</label>
          <select class="form-select" id="theme" required>
            <option value="amor">Amor</option>
            <option value="carreira">Carreira</option>
            <option value="espiritualidade">Espiritualidade</option>
            <option value="geral">Geral</option>
          </select>
        </div>

        <div class="col-12">
          <label for="question" class="form-label">Sua intenção (opcional)</label>
          <input id="question" type="text" class="form-control" maxlength="140" placeholder="Ex: O que preciso entender neste momento?" />
        </div>

        <div class="col-12 d-flex flex-wrap gap-2 align-items-center">
          <button type="submit" class="btn btn-oracle">Revelar leitura ✨</button>
          <button type="button" class="btn btn-outline-light" id="shuffle-btn">Nova energia 🔮</button>
          <small class="text-soft">Dica: respire fundo e foque na sua pergunta antes de revelar.</small>
        </div>
      </form>
    </section>

    <section id="result" class="d-none" aria-live="polite">
      <div class="glass p-4 mb-4">
        <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-3">
          <div>
            <h2 class="h3 mb-1" id="result-title"></h2>
            <p class="text-soft mb-0" id="result-subtitle"></p>
          </div>
          <span class="badge rounded-pill text-bg-warning" id="reading-date"></span>
        </div>

        <div class="row g-3" id="cards"></div>
      </div>

      <div class="glass p-4">
        <h3 class="h5 mb-2">Síntese da leitura</h3>
        <p class="mb-0" id="summary"></p>
      </div>
    </section>

    <section class="history mt-4" id="history-section" hidden>
      <h3 class="h5 mb-3">Última leitura salva</h3>
      <div class="glass p-3" id="history-content"></div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
